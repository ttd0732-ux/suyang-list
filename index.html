<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전국 수련회 장소 리스트</title>
<meta name="description" content="교회가 실제 수련회 갈 수 있는 전국 수양관·수련시설 리스트">
<meta property="og:title" content="전국 수련회 장소 리스트">
<meta property="og:description" content="교회가 실제 수련회 갈 수 있는 전국 수양관·수련시설 리스트">
<meta property="og:image" content="https://suyang-list.vercel.app/og-image.jpg?v=20261016">
<meta property="og:url" content="https://suyang-list.vercel.app/">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5f5f5;color:#333}
header{background:#2e7d32;color:#fff;padding:20px 16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:1.3rem;margin-bottom:4px}
header p{font-size:.8rem;opacity:.9}
.contact{background:#1b5e20;color:#fff;text-align:center;font-size:.8rem;padding:8px}
.notice{max-width:900px;margin:12px auto;padding:12px 18px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;color:#8d6e00;font-size:.88rem;text-align:center;line-height:1.5}
.guide{max-width:900px;margin:0 auto 4px;padding:10px 18px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;color:#2e7d32;font-size:.88rem;text-align:center}
.search-bar{max-width:900px;margin:0 auto;padding:0 16px 8px}
.search-bar input{width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:8px;font-size:1rem}
.type-tabs{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;gap:8px}
.type-tabs button{flex:1;padding:12px;border:none;border-radius:8px;background:#e0e0e0;font-size:1rem;cursor:pointer;font-weight:bold}
.type-tabs button.active{background:#2e7d32;color:#fff}
.region-tabs{max-width:900px;margin:0 auto;padding:4px 16px 8px;display:flex;flex-wrap:wrap;gap:6px}
.region-tabs button{padding:8px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;font-size:.85rem;cursor:pointer}
.region-tabs button.active{background:#2e7d32;color:#fff;border-color:#2e7d32}
.stats{text-align:center;color:#888;font-size:.85rem;padding:4px 0 12px}
.list-container{max-width:900px;margin:0 auto;padding:0 16px 30px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);cursor:pointer}
.card h3{font-size:1.05rem;margin-bottom:6px;color:#1b5e20}
.card .type-badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;margin-bottom:6px;font-weight:bold}
.card .type-badge.수양관{background:#e8f5e9;color:#2e7d32}
.card .type-badge.수양관외{background:#e3f2fd;color:#1565c0}
.card .phone{display:inline-block;color:#1565c0;text-decoration:none;font-size:.95rem;margin:4px 0}
.card .addr{font-size:.85rem;color:#666;margin-top:4px}
.card .cat{font-size:.78rem;color:#999;margin-top:4px}
#mapModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
#mapModal.show{display:flex}
.modal-content{background:#fff;border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow:auto}
.modal-header{padding:16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.modal-header h3{font-size:1.1rem}
.modal-close{border:none;background:none;font-size:1.5rem;cursor:pointer;color:#999}
.modal-body{padding:16px}
#map{width:100%;height:400px;border-radius:8px;background:#f0f0f0}
.modal-body .phone{display:inline-block;margin:8px 0;color:#1565c0;text-decoration:none;font-size:1rem}
.modal-body .addr{font-size:.9rem;color:#666;margin-bottom:8px}
.modal-body .notes{font-size:.82rem;color:#555;background:#f9f9f9;padding:8px 10px;border-radius:6px;margin-top:8px;line-height:1.6}
.modal-body .notes .notes-label{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:#2e7d32;border-radius:4px;padding:2px 7px;margin-right:6px;vertical-align:1px}
footer{text-align:center;padding:20px;color:#999;font-size:.8rem}
</style>
</head>
<body>
<header>
<h1>⛪ 전국 수련회 장소 리스트</h1>
<p>교회가 실제 수련회 갈 수 있는 곳 · 카드를 누르면 지도 표시</p>
</header>
<div class="contact">앱 문의) shs목사 · ttd0732@hanmail.net</div>
<div class="notice">※ 이 리스트의 장소는 각 시설의 사정에 따라 <b>운영이 중단되거나 변경될 수 있습니다.</b><br>방문 전에는 <b>꼭 전화로 미리 연락</b>하여 확인해 보세요.</div>
<div class="guide">📞 <b>전화번호를 누르면 바로 전화</b>가 걸립니다 &nbsp;·&nbsp; 🗺️ <b>장소 카드를 누르면 지도</b>가 나옵니다</div>
<div class="search-bar">
<input type="text" id="searchInput" placeholder="🔍 장소 이름으로 검색...">
</div>
<div class="type-tabs" id="typeTabs">
<button data-type="all" class="active">전체 <span id="cntAll"></span></button>
<button data-type="수양관">수양관 <span id="cntSuyang"></span></button>
<button data-type="수양관외">수양관 외 <span id="cntOther"></span></button>
</div>
<div class="region-tabs" id="regionTabs"></div>
<div class="stats" id="stats"></div>
<div class="list-container" id="listContainer"></div>

<div id="mapModal">
<div class="modal-content">
<div class="modal-header">
<h3 id="modalTitle"></h3>
<button class="modal-close" onclick="closeModal()">×</button>
</div>
<div class="modal-body" id="modalBody"></div>
<div style="padding:0 16px 16px"><div id="map"></div></div>
</div>
</div>

<footer>앱 문의) shs목사 · ttd0732@hanmail.net</footer>

<script src="retreat_data.js"></script>
<script>
const KAKAO_API_KEY = '90f233691556905b1336f96831a3618a';
let currentType = 'all';
let currentRegion = 'all';
let searchQuery = '';

const REGIONS = ['서울','인천','경기','강원','충북','충남','대전','세종','전북','전남','광주','경북','경남','대구','울산','부산','제주'];

function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function initRegionTabs(){
  const c = document.getElementById('regionTabs');
  c.innerHTML = '<button data-region="all" class="active">전체지역</button>' +
    REGIONS.map(r=>`<button data-region="${r}">${r}</button>`).join('');
  c.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      c.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      currentRegion = b.dataset.region;
      renderList();
    };
  });
}

function getFiltered(){
  return RETREAT_DATA.filter(d=>{
    if(currentType!=='all' && d.type!==currentType) return false;
    if(currentRegion!=='all' && d.region!==currentRegion) return false;
    if(searchQuery && !d.name.includes(searchQuery)) return false;
    return true;
  });
}

function renderList(){
  const data = getFiltered();
  const c = document.getElementById('listContainer');
  document.getElementById('stats').textContent = `총 ${data.length}곳`;
  if(!data.length){
    c.innerHTML = '<div style="text-align:center;padding:40px;color:#999">검색 결과가 없습니다.</div>';
    return;
  }
  c.innerHTML = data.map((d,i)=>{
    const idx = RETREAT_DATA.indexOf(d);
    const tel = d.phone.replace(/[^0-9]/g,'');
    return `<div class="card" onclick="showMap(${idx})">
      <span class="type-badge ${d.type}">${d.type==='수양관'?'수양관':'수양관 외'}</span>
      <h3>${escapeHtml(d.name)}</h3>
      <a class="phone" href="tel:${tel}" onclick="event.stopPropagation()">📞 ${escapeHtml(d.phone)}</a>
      <div class="addr">📍 ${escapeHtml(d.address||'주소 미등록')}</div>
      <div class="cat">${escapeHtml(d.region)} · ${escapeHtml(d.city)}${d.category?' · '+escapeHtml(d.category):''}</div>
    </div>`;
  }).join('');
}

function closeModal(){
  document.getElementById('mapModal').classList.remove('show');
}

document.getElementById('mapModal').addEventListener('click', e=>{
  if(e.target.id==='mapModal') closeModal();
});

// 타입 탭
document.getElementById('typeTabs').querySelectorAll('button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('#typeTabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentType = b.dataset.type;
    renderList();
  };
});

// 검색
document.getElementById('searchInput').addEventListener('input', e=>{
  searchQuery = e.target.value.trim();
  renderList();
});

// 카카오맵
let kakaoLoaded = false;
let kakaoFailed = false;
function loadKakaoMap(callback){
  if(kakaoLoaded){callback();return;}
  if(kakaoFailed){
    document.getElementById('map').innerHTML = '<div style="padding:40px;text-align:center;color:#999">지도를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
    return;
  }
  const script = document.createElement('script');
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_API_KEY}&libraries=services&autoload=false`;
  script.onload = ()=>{kakao.maps.load(()=>{kakaoLoaded=true;callback();});};
  script.onerror = ()=>{
    kakaoFailed = true;
    document.getElementById('map').innerHTML = '<div style="padding:40px;text-align:center;color:#999">지도를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
  };
  document.head.appendChild(script);
}

let mapInstance = null;
function showMap(idx){
  const d = RETREAT_DATA[idx];
  document.getElementById('modalTitle').textContent = d.name;
  const tel = d.phone.replace(/[^0-9]/g,'');
  let bodyHtml = `
    <a class="phone" href="tel:${tel}">📞 ${escapeHtml(d.phone)}</a>
    <div class="addr">📍 ${escapeHtml(d.address||'주소 미등록')}</div>
  `;
  if(d.notes){
    bodyHtml += `<div class="notes"><span class="notes-label">특징</span>${escapeHtml(d.notes)}</div>`;
  }
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('mapModal').classList.add('show');

  loadKakaoMap(()=>{
    const mapContainer = document.getElementById('map');
    mapContainer.innerHTML = '';
    const mapOption = {center: new kakao.maps.LatLng(36.5, 127.5), level: 8};
    mapInstance = new kakao.maps.Map(mapContainer, mapOption);
    setTimeout(()=>{mapInstance.relayout();}, 100);

    if(d.address){
      const geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(d.address, (result, status)=>{
        if(status === kakao.maps.services.Status.OK){
          const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
          const marker = new kakao.maps.Marker({map: mapInstance, position: coords});
          const infowindow = new kakao.maps.InfoWindow({content: `<div style="padding:5px;font-size:12px;">${escapeHtml(d.name)}</div>`});
          infowindow.open(mapInstance, marker);
          mapInstance.setCenter(coords);
          mapInstance.setLevel(4);
        }else{
          document.getElementById('modalBody').innerHTML += `<div class="notes">* 지도에서 주소를 찾지 못했습니다.</div>`;
        }
      });
    }
  });
}

// PWA 서비스 워커
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

function updateTypeCounts(){
  const suyang = RETREAT_DATA.filter(d=>d.type==='수양관').length;
  const other = RETREAT_DATA.filter(d=>d.type==='수양관외').length;
  document.getElementById('cntAll').textContent = `(${RETREAT_DATA.length})`;
  document.getElementById('cntSuyang').textContent = `(${suyang})`;
  document.getElementById('cntOther').textContent = `(${other})`;
}

initRegionTabs();
updateTypeCounts();
renderList();
</script>
</body>
</html>
